<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fogoncito - Hamburguesas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <span class="logo-icon">🔥</span>
            <h1>FOGONCITO</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html" class="nav-link">Inicio</a></li>
                <li><a href="pages/pedido.html" class="btn-header">🛒 Mi pedido</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-iconos">🔥 🔥 🔥</div>
        <h1 class="hero-titulo">FOGONCITO</h1>
        <p class="hero-subtitulo">HAMBURGUESERÍA ARTESANAL</p>
        <p class="hero-descripcion">Elegí tu hamburguesa, personalizá tu pedido y nosotros lo preparamos con fuego.</p>
    </section>

    <div class="filtros">
        <button class="btn-filtro activo">🍟 PROMOCIONES</button>
        <button class="btn-filtro">🍔 MENÚ COMPLETO</button>
        <button class="btn-filtro">🥤 BEBIDAS</button>
    </div>

    <main>
        <section id="promociones">
            <h2>Promociones del día</h2>
            <div class="grilla-productos" id="contenedor-promos"></div>
        </section>

        <section id="menu-completo">
            <h2>Menú Completo</h2>
            <div class="grilla-productos" id="contenedor-menu"></div>
        </section>
    </main>

    <footer>
        <div class="carrito-flotante">
            <span id="contador-carrito">0</span>
            <a href="pages/pedido.html">Ver mi pedido</a>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
