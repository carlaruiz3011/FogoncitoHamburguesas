<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fogoncito - Tu Pedido</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="checkout-container">
        <div class="checkout-header">
            <a href="../index.html" class="btn-volver">← Volver</a>
            <div class="logo">
                <span class="logo-icon">🔥</span>
                <h1>FOGONCITO</h1>
            </div>
        </div>

        <h2 class="titulo-pagina">Tu pedido</h2>
        <div id="lista-carrito"></div>

        <form id="form-checkout">
            <h3 class="seccion-titulo">¿Quién hace el pedido?</h3>
            <div class="fila-inputs">
                <div class="campo">
                    <label>NOMBRE</label>
                    <input type="text" id="nombre" placeholder="Juan" required>
                </div>
                <div class="campo">
                    <label>APELLIDO</label>
                    <input type="text" id="apellido" placeholder="García" required>
                </div>
            </div>

            <h3 class="seccion-titulo">¿Cómo lo querés?</h3>
            <div class="opciones-grid">
                <div class="opcion-card seleccionado" onclick="seleccionarOpcion(this, 'delivery')">
                    <span class="icono">🛵</span>
                    <h4>Delivery</h4>
                    <p>Envío: $1.500</p>
                </div>
                <div class="opcion-card" onclick="seleccionarOpcion(this, 'retiro')">
                    <span class="icono">🏪</span>
                    <h4>Pasa a retirar</h4>
                    <p>Sin costo de envío</p>
                </div>
            </div>

            <div id="seccion-direccion">
                <div class="campo" style="margin-bottom: 15px;">
                    <input type="text" id="direccion" placeholder="Ej: Pirovano 213" required>
                </div>
            </div>

            <h3 class="seccion-titulo">¿Cómo querés pagar?</h3>
            <div class="opciones-grid" style="flex-direction: column; gap: 10px;">
                <div class="opcion-card" onclick="seleccionarOpcion(this, 'tarjeta')">
                    <h4>💳 Tarjeta de crédito/débito</h4>
                </div>
                <div class="opcion-card seleccionado" onclick="seleccionarOpcion(this, 'transferencia')">
                    <h4>🏦 Transferencia bancaria</h4>
                </div>
            </div>

            <div class="resumen-pago">
                <div class="fila-resumen">
                    <span>Subtotal</span>
                    <span id="resumen-subtotal">$0</span>
                </div>
                <div class="fila-resumen" id="fila-envio">
                    <span>Envío</span>
                    <span id="resumen-envio">$1.500</span>
                </div>
                <div class="fila-resumen total">
                    <span>TOTAL</span>
                    <span id="resumen-total">$0</span>
                </div>
            </div>

            <div class="contenedor-boton-confirmar">
                <button type="submit" class="btn-confirmar">CONFIRMAR PEDIDO →</button>
            </div>
        </form>
    </div>
    <script src="../js/main.js"></script>
</body>
</html>
